services:
  # -----------------------------------------------------------------
  # Service 1: ClickHouse Database (The Engine)
  # -----------------------------------------------------------------
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    restart: no
    # entrypoint: ["/usr/bin/clickhouse-server", "--config-file=/etc/clickhouse-server/config.xml"]
    # command: ["--config-file=/etc/clickhouse-server/config.xml"]
    ports:
      # Bind to localhost by default so ClickHouse isn't exposed to the internet.
      # Remove the leading "127.0.0.1:" if you explicitly want remote access.
      - "127.0.0.1:${CH_HTTP_PUBLISHED_PORT:-8123}:8123"  # HTTP
      - "127.0.0.1:${CH_TCP_PUBLISHED_PORT:-9000}:9000"   # TCP
    volumes:
      # Default is a named volume. Set CH_DATA_DIR to a path (e.g. /data/clickhouse) to use a bind-mount instead.
      - "${CH_DATA_DIR:-clickhouse_data}:/var/lib/clickhouse"
      - "/data1/pouya_data/clickhouse/log:/var/log/clickhouse-server"
      # - "./listen_fix.xml:/etc/clickhouse-server/config.d/listen_fix.xml"
      # - "./default_user.xml:/etc/clickhouse-server/users.d/default_user.xml"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    environment:
      CLICKHOUSE_DB: ${CH_DB:-sensors}
      CLICKHOUSE_SKIP_USER_SETUP: "1"

  # -----------------------------------------------------------------
  # Service 2: API
  # -----------------------------------------------------------------
  api:
    build: .
    image: mndot_project:latest
    restart: no
    ports:
      - "${APP_PORT:-8000}:8000"
    
    # 1. Mount your local directory (.) to the container's working directory
    volumes:
      - .:/app
    
    # 2. Override the default startup command to include --reload
    # (Adjust 'app:app' if your python instance is named differently, like 'main:app')
    command: ["gunicorn", "--reload", "-b", "0.0.0.0:8000", "app:app"]

    depends_on:
      clickhouse:
        condition: service_healthy
    # Removed "extra_hosts" (Not needed anymore)
    environment:
      # CHANGED: Default host is now the service name "clickhouse"
      CH_HOST: ${CH_HOST:-clickhouse}
      CH_PORT: ${CH_PORT:-8123}
      CH_DB: ${CH_DB:-sensors}
      CH_USER: ${CH_USER:-}
      CH_PASSWORD: ${CH_PASSWORD:-}

  # # -----------------------------------------------------------------
  # # Service 3: Scheduler
  # # -----------------------------------------------------------------
  daily_metrics:
    build: .
    image: mndot_project:latest
    restart: no
    command: ["python", "scheduler.py"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # CHANGED: Default host is now the service name "clickhouse"
      CH_HOST: ${CH_HOST:-clickhouse}
      CH_PORT: ${CH_PORT:-8123}
      CH_DB: ${CH_DB:-sensors}
      CH_USER: ${CH_USER:-}
      CH_PASSWORD: ${CH_PASSWORD:-}
      JOB_TZ: ${JOB_TZ:-America/Chicago}
      PYTHONUNBUFFERED: "1"

volumes:
  clickhouse_data:
